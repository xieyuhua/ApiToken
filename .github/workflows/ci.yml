name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# 同一分支连续推送时，取消还在排队的旧构建，省掉无意义的等待
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # 用 -l 只列出未格式化的文件，不改源码：格式问题应该由本地 make fmt 修掉
      - name: gofmt
        run: |
          list=$(gofmt -l .)
          if [ -n "$list" ]; then
            echo "以下文件未 gofmt，请本地执行 make fmt："
            echo "$list"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # 这是个大量用 goroutine / RWMutex / atomic 的转发网关，
      # 竞态只能靠 -race 发现，跑 CI 时开着比事后线上排查便宜得多
      - name: go test
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: coverage summary
        if: always()
        run: go tool cover -func=coverage.out | tail -n 1

      - name: build
        run: go build ./...

  webui:
    name: Web UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: webui regression
        run: node tools/webui_test.js
