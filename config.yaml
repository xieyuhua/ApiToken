server:
  addr: :18125
  request_timeout: 5m0s
  stream_timeout: 15m0s
  read_timeout: 1m0s
  write_timeout: 0s
  max_body_mb: 32
  data_dir: ./data
security:
  client_keys:
    - xieyuhua
  admin_token: xieyuhua
routing:
  strategy: priority_round_robin
  max_attempts: 3
  force_stream_usage: true
  retry_status:
    - 400
    - 408
    - 409
    - 425
    - 429
    - 500
    - 502
    - 503
    - 504
    - 529
  cooldown: 1m0s
logging:
  level: info
  access_log: true
  keep_logs: 800
  record_payload: true
  payload_limit: 8000
  # 访问日志落盘：默认开启，重启后仍可在日志页查看历史（按 file_keep 轮转清理）。
  # 关闭后日志只进内存，重启即清空。
  file_enabled: true
  file_dir: ""
  file_max_mb: 0
  file_keep: 0
upstream:
  default_timeout: 2m0s
  connect_timeout: 10s
  keep_alive: 30s
  max_idle_conns: 200
  max_idle_conns_per_host: 0
  proxy_url: ""
# 显式路由：同一个模型名可以绑定多个渠道，按顺序故障转移

routes:
# 渠道（上游账号）。也可以启动后在 Web 界面添加
channels:
ui:
  theme: light
