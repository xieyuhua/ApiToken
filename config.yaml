server:
  addr: :18125
  request_timeout: 5m0s
  stream_timeout: 15m0s
  read_timeout: 1m0s
  write_timeout: 0s
  max_body_mb: 32
  data_dir: ./data
security:
  client_keys:
    - xieyuhua
  admin_token: xieyuhua
routing:
  strategy: priority_round_robin
  max_attempts: 2
  force_stream_usage: true
  retry_status:
    - 400
    - 408
    - 409
    - 425
    - 429
    - 500
    - 502
    - 503
    - 504
    - 529
logging:
  level: info
  access_log: true
  # 内存里保留的日志条数（控制台日志页只读这部分热数据）
  keep_logs: 800
  record_payload: true
  payload_limit: 8000
  # 访问日志异步落盘为 JSONL 分段文件：由后台协程批量写，请求路径不受影响。
  # 改动这几项需要重启生效（涉及文件句柄）。
  file_enabled: true
  # file_dir: ./data/logs      # 空 = <data_dir>/logs
  file_max_mb: 64              # 单个分段文件大小上限，超过则滚动新文件
  file_keep: 7                 # 保留的最近分段文件数
upstream:
  # 单个上游的空闲连接上限；留空 = 与 max_idle_conns 相同。
  # 流式请求会长时间独占连接，该值偏小会导致连接反复新建（TCP + TLS 握手开销）。
  # max_idle_conns_per_host: 200
  default_timeout: 2m0s
  connect_timeout: 10s
  keep_alive: 30s
  max_idle_conns: 200
  proxy_url: ""
# 显式路由：同一个模型名可以绑定多个渠道，按顺序故障转移
routes:
  - model: "deepseek-chat"
    enabled: true
    channels: ["deepseek-1", "tencent-1"] # 按顺序尝试
    model_map: # 可选：按渠道覆盖真实模型名
      tencent-1: "deepseek-v3.2"
# 渠道（上游账号）。也可以启动后在 Web 界面添加
channels:
  - id: "deepseek-1"
    name: "DeepSeek 官方"
    base_url: "https://api.deepseek.com/v1"
    api_key: "sk-xxxxxxxxxxxxxxxx"
    models: ["deepseek-chat", "deepseek-reasoner"]
    weight: 1
    priority: 10
    enabled: true
  - id: "sensenova-1"
    name: "商汤日日新 Token Plan"
    base_url: "https://token.sensenova.cn/v1"
    api_key: "xxxxxxxxxxxxxxxx"
    models: ["SenseNova-6.8-Flash-Lite"]
    weight: 1
    priority: 20
    enabled: true
    # 若用大装置 compatible-mode，base_url 改为 https://api.sensenova.cn/compatible-mode/v2
  - id: "tencent-1"
    name: "腾讯云代码助手 WorkBuddy"
    base_url: "https://api.copilot.tencent.com/api/v1"
    api_key: "xxxxxxxxxxxxxxxx"
    models: [] # 留空 = 放通所有模型，也可在界面上点“拉取模型”自动填充
    weight: 1
    priority: 5
    enabled: true
    note: "专享版 base_url: https://{enterpriseId}.copilot.qq.com/api/v1"
  - id: "opencode-1"
    name: "OpenCode Zen"
    base_url: "https://opencode.ai/zen/v1"
    api_key: "xxxxxxxxxxxxxxxx"
    models: ["deepseek-v4-pro", "deepseek-v4.1-flash", "kimi-k2.7-code", "glm-5.3", "minimax-m3"]
    weight: 1
    priority: 30
    enabled: false
    note: "订阅 Key 直接当 Bearer 用；Claude 系需 chat_path=/messages，GPT 系需 /responses"
  - id: "stepfun-1"
    name: "阶跃星辰 StepFun"
    base_url: "https://api.stepfun.com/v1"
    api_key: "xxxxxxxxxxxxxxxx"
    models: ["step-3.5-flash", "step-2-16k", "step-1x-32k"]
    weight: 1
    priority: 40
    enabled: false
    note: "Coding Plan 订阅用 https://api.stepfun.com/step_plan/v1"
ui:
  theme: light
