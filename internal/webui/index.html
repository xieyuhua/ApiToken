<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>apitoken · 大模型 API 网关</title>
<link rel="stylesheet" href="/static/style.css" />
<script>(function(){try{var t=localStorage.getItem('apitoken_theme')||'auto';if(t==='auto'){t=window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';}document.documentElement.dataset.theme=t;}catch(e){}})();</script>
</head>
<body>
<header>
  <h1>⚡ apitoken</h1>
  <nav>
    <a href="/" class="active">控制台</a>
    <a href="/channels">渠道</a>
    <a href="/routes">路由</a>
    <a href="/logs">调用日志</a>
    <a href="/diagnostics">测试</a>
    <a href="/chat">对话</a>
    <a href="/settings">设置</a>
  </nav>
  <span class="tag" id="ver">-</span>
  <span class="sp"></span>
  <input id="token" placeholder="管理令牌 adm-xxx" style="width:190px" />
  <button class="ghost" onclick="saveToken()">保存</button>
  <button class="ghost" onclick="refresh()">刷新</button>
</header>

<main>
  <div class="cards" id="cards"></div>

  <section>
    <h2>聚合分析<span class="sp"></span><span class="muted" style="font-size:12px">基于全部调用日志（内存保留范围内）</span></h2>
    <div class="pad">
      <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr))">
        <div>
          <label>按模型（次数 / 平均延迟）</label>
          <div class="bars" id="barModel"></div>
        </div>
        <div>
          <label>按渠道（次数 / 平均延迟）</label>
          <div class="bars" id="barChannel"></div>
        </div>
        <div>
          <label>按状态码</label>
          <div class="bars" id="barStatus"></div>
        </div>
      </div>
      <label style="margin-top:14px">高频错误</label>
      <div class="bars" id="barError"></div>
    </div>
  </section>
</main>

<div class="toast" id="toast"></div>

<script src="/static/app.js"></script>
<script>
async function refresh() {
  try {
    const [info, stats] = await Promise.all([
      api('/admin/api-info'), api('/admin/stats')
    ]);
    $('ver').textContent = 'v' + info.version + ' · 运行 ' + info.uptime + ' · 策略 ' + (info.routing?.strategy || '-');
    renderCards(stats);
    renderAggregate();
  } catch (e) { toast(e.message, true); }
}

function renderCards(s) {
  $('cards').innerHTML = [
    ['总请求', fmt(s.total_requests), '当前进程累计'],
    ['成功率', s.total_requests ? (s.total_success * 100 / s.total_requests).toFixed(1) + '%' : '-', `${fmt(s.total_success)} 成功 / ${fmt(s.total_failed)} 失败`],
    ['Token 用量', fmt(s.prompt_tokens + s.completion_tokens), `↓${fmt(s.prompt_tokens)} ↑${fmt(s.completion_tokens)}`],
    ['平均延迟', fmtLatency(s.avg_latency_ms), '网关端到端'],
    ['启用渠道', s.enabled_channels + ' / ' + s.channel_count, '含多平台账号'],
    ['可路由模型', Object.keys(s.models || {}).length, '见 /v1/models'],
    ['运行时长', fmtUptime(s.uptime_seconds), fmtTimeShort(s.started_at) + ' 启动']
  ].map(([l, v, sub]) => `<div class="card"><div class="label">${l}</div><div class="value">${v}</div><div class="sub">${sub}</div></div>`).join('');
}

// 聚合分析：复用 /admin/logs 的聚合统计（不带筛选条件 = 全部日志）。
// 只取 stats 字段，page_size 设 1 即可（BuildSummary 在分页前基于全量计算）。
async function renderAggregate() {
  try {
    const data = await api('/admin/logs?page=1&page_size=1');
    const s = data.stats || {};
    renderBars('barModel', s.by_model, { showLatency: true });
    renderBars('barChannel', s.by_channel, { showLatency: true });
    renderBars('barStatus', s.by_status);
    renderBars('barError', (s.top_errors || []).map(e => ({ name: e.name, count: e.count, failed: e.count })));
  } catch (e) { /* 日志聚合失败不影响概览卡片 */ }
}

initToken();
refresh();
setInterval(refresh, 15000);
</script>
</body>
</html>
