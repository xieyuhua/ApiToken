<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>apitoken · 大模型 API 网关</title>
<link rel="stylesheet" href="/static/style.css" />
<script>(function(){try{var t=localStorage.getItem('apitoken_theme')||'auto';if(t==='auto'){t=window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';}document.documentElement.dataset.theme=t;}catch(e){}})();</script>
<style>
  /* 聚合分析：每个统计单独一行 */
  .agg-card{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:13px 15px;min-width:0;margin-bottom:12px}
  .agg-card:last-child{margin-bottom:0}
  .agg-title{font-size:12px;color:var(--muted);margin-bottom:12px;display:flex;align-items:center;gap:6px}
</style>
</head>
<body>
<header>
  <h1>⚡ apitoken</h1>
  <nav>
    <a href="/" class="active">控制台</a>
    <a href="/channels">渠道</a>
    <a href="/routes">路由</a>
    <a href="/logs">调用日志</a>
    <a href="/runtime-logs">运行日志</a>
    <a href="/diagnostics">测试</a>
    <a href="/chat">对话</a>
    <a href="/settings">设置</a>
  </nav>
  <span class="tag" id="ver">-</span>
  <span class="sp"></span>
  <input id="token" placeholder="管理令牌 adm-xxx" style="width:190px" />
  <button class="ghost" onclick="saveToken()">保存</button>
  <button class="ghost" onclick="refresh()">刷新</button>
</header>

<main>
  <div class="cards" id="cards"></div>

  <section>
    <h2>聚合分析<span class="sp"></span><span class="muted" style="font-size:12px">基于全部调用日志（内存保留范围内）</span></h2>
    <div class="pad">
      <div class="agg-card"><div class="agg-title">📦 按模型（次数 / 平均延迟）</div><div class="cols" id="barModel"></div></div>
      <div class="agg-card"><div class="agg-title">🪙 按模型 Token 用量（↓输入 / ↑输出）</div><div class="cols" id="barToken"></div></div>
      <div class="agg-card"><div class="agg-title">🔌 按渠道（次数 / 平均延迟）</div><div class="cols" id="barChannel"></div></div>
      <div class="agg-card"><div class="agg-title">🪙 按渠道 Token 用量（↓输入 / ↑输出）</div><div class="cols" id="barChannelToken"></div></div>
      <div class="agg-card"><div class="agg-title">🚦 按状态码</div><div class="cols" id="barStatus"></div></div>
    </div>
  </section>
</main>

<div class="toast" id="toast"></div>

<script src="/static/app.js"></script>
<script>
async function refresh() {
  try {
    const [info, stats] = await Promise.all([
      api('/admin/api-info'), api('/admin/stats')
    ]);
    $('ver').textContent = 'v' + info.version + ' · 运行 ' + info.uptime + ' · 策略 ' + (info.routing?.strategy || '-');
    renderCards(stats);
    renderAggregate();
  } catch (e) { toast(e.message, true); }
}

// 与「调用日志」页一致的卡片风格（label / value / sub 三段式）
function renderCards(s) {
  $('cards').innerHTML = [
    ['总请求', fmt(s.total_requests), '当前进程累计'],
    ['成功率', s.total_requests ? (s.total_success * 100 / s.total_requests).toFixed(1) + '%' : '-', `${fmt(s.total_success)} 成功 / ${fmt(s.total_failed)} 失败`],
    ['Token 用量', fmt(s.prompt_tokens + s.completion_tokens), `↓${fmt(s.prompt_tokens)} ↑${fmt(s.completion_tokens)}`],
    ['平均延迟', fmtLatency(s.avg_latency_ms), '网关端到端'],
    ['启用渠道', s.enabled_channels + ' / ' + s.channel_count, '含多平台账号'],
    ['可路由模型', Object.keys(s.models || {}).length, '见 /v1/models'],
    ['运行时长', fmtUptime(s.uptime_seconds), fmtTimeShort(s.started_at) + ' 启动']
  ].map(([l, v, sub]) => `<div class="card"><div class="label">${l}</div><div class="value">${v}</div><div class="sub">${sub}</div></div>`).join('');
}

// 聚合分析：复用 /admin/logs 的聚合统计（不带筛选条件 = 全部日志）。
// 只取 stats 字段，page_size 设 1 即可（BuildSummary 在分页前基于全量计算）。
async function renderAggregate() {
  try {
    const data = await api('/admin/logs?page=1&page_size=1');
    const s = data.stats || {};
    renderLine('barModel', s.by_model, { showLatency: true });
    renderLine('barToken', s.by_model, { showTokens: true });
    renderLine('barChannel', s.by_channel, { showLatency: true });
    renderLine('barChannelToken', s.by_channel, { showTokens: true });
    renderLine('barStatus', s.by_status);
  } catch (e) { /* 日志聚合失败不影响概览卡片 */ }
}

initToken();
refresh();
setInterval(refresh, 15000);
</script>
</body>
</html>
